# "How it works" write-ups, one per project, shown at /how. The id must match a project in site.yaml.
# Each section has a title and exactly one of: steps (numbered), points (name and explanation),
# list (bullets) or text (paragraphs). Only write what is true and checkable.
- id: aslive
  lede: ASLive turns a hand held up to a camera into typed letters. Nothing in it needs a server. The whole pipeline runs on the device, and on this site it runs inside your browser tab.
  sections:
    - title: From camera frame to letter
      steps:
        - head: Find the hand
          body: "Each camera frame goes to MediaPipe's hand tracker, which returns 21 landmarks: the wrist and four points along each finger, each with x, y and depth. On this site the tracker runs in a background thread so the page never stalls, on the graphics card when there is one."
        - head: Make every hand comparable
          body: Raw positions depend on where the hand sits in the frame and how far it is from the lens. So every point is measured from the wrist, then divided by the distance from the wrist to the tip of the middle finger. A hand close to the camera and a hand at arm's length come out as nearly the same 63 numbers.
        - head: Let 100 trees vote
          body: "Those 63 numbers go to a Random Forest: 100 decision trees that each look at the hand and vote. The result is a probability for each of 27 signs, the letters A to Z plus space."
        - head: Decide when to type
          body: A camera produces many answers a second, and a hand passes through other shapes on its way to the one it means. The app accepts a letter only when the model is 90 to 95% sure of it. On this site a letter is typed after the model gives the same answer 12 frames in a row with at least 50% confidence.
    - title: What the design buys
      points:
        - head: Landmarks, not pixels
          body: The classifier never sees the image, only 63 numbers. Lighting, background and skin tone are dealt with by the hand tracker before the model runs, and the model itself stays small.
        - head: A forest, not a neural network
          body: I tried a neural network first and spent two or three hours on it. I had recorded all the training data myself, so there was not much of it, and the network did not learn the signs reliably. A Random Forest on the hand landmarks gave better results from that small amount of data, and faster ones. The trained model is 2.7 MB, needs no graphics card, and runs on every frame.
        - head: Everything on the device
          body: The video never leaves the device. There is no server to send it to.
    - title: Moving it into a browser
      text:
        - The app is written in Python with scikit-learn. For this site the trained forest is exported into a single binary file, with a small TypeScript reader that walks the same trees. The model in the demo is the real one, not a lookalike.
        - "To prove the port is exact, an automated test runs 150 real hands through both versions. Every top answer matches, and no probability differs by more than 0.01."
    - title: Limits
      list:
        - It reads fingerspelling, one hand at a time. Full ASL has signs, grammar, movement and facial expression, and this does not attempt them.
        - J and Z are traced in the air in real ASL. The model sees one frame at a time, so it knows them only as a still pose.
        - I recorded all the training data with my own hands, so the model has learned one person's hands and one person's way of signing.
        - The accuracy figure, 85 to 90%, comes from testing it live by hand.
- id: super-scholar
  lede: Super Scholar takes a research paper and turns it into a platformer. Each section becomes a world with levels, a short lesson, practice questions and a boss that quizzes you. It works on five built-in papers, on any PDF you upload, and on papers found by searching OpenAlex.
  sections:
    - title: From PDF to game
      steps:
        - head: Read the PDF in the browser
          body: pdf.js pulls the text out of the PDF inside the browser tab, line by line, along with each line's font size. The file itself is never uploaded. It handles papers up to 120 pages.
        - head: Find the sections
          body: Headings are usually set in a bigger font than the body. So the generator works out which font size most of the text uses and treats larger lines as headings. When a PDF does not do that, it falls back to numbered lines like "3 Results". Page numbers and repeated headers are dropped, and everything from the references on is cut. Sections become worlds, five at most, and extra sections are merged with their neighbours.
        - head: Find what matters
          body: Key terms are the words and two-word phrases that come up often in some sections but not everywhere, which is a TF-IDF score. Each sentence is scored by the key terms it contains, with a bonus for the opening sentences of a section. The best sentences become the lesson, and the key terms become fill-in-the-blank questions.
        - head: Rewrite it in plain words, when possible
          body: When a free AI model is available, it is sent each section's key sentences and asked to rewrite that world in plain words. Its answer must pass the same strict checks as everything else in the game. If it fails them, or no model answers, the rules-made world is used instead. Each paper's result is saved, so the same paper never costs a second request.
        - head: Build the levels
          body: Levels are stitched together from small hand-designed chunks, each one beatable on its own. The same seed always gives the same level, and a difficulty setting decides how many enemies and hazards go in.
    - title: What the design buys
      points:
        - head: Rules first, AI second
          body: The game never depends on an AI answering. The rules alone turn a paper into a full playable game, with no server involved. A model being down or out of quota costs some polish and nothing else.
        - head: Chunks, not random tiles
          body: A level made of random tiles can be impossible to finish. A level made of chunks that are each beatable stays beatable, and a checker confirms it.
        - head: Fair, not just possible
          body: The checker finds every spot the player can reach by walking, dropping and jumping. It allows a jump to use at most 80% of a perfect running jump's reach, so a level is fair for a person and not only possible for a computer.
    - title: How it is tested
      text:
        - There are 192 automated tests. One of them generates 500 levels across every difficulty and checks that each can be finished.
        - A further 19 play-through checks drive the real game in a hidden browser, including on a phone-sized screen.
        - The server side limits how many requests each visitor can make a minute, and every page is sent with a strict content security policy.
    - title: Limits
      list:
        - The rules read text only. Figures, tables and equations do not make it into the game.
        - Rules-made questions are fill-in-the-blank on key terms. They test whether you remember a term, not whether you understand it.
        - A scanned paper with no text layer cannot be read.
- id: chefs-fridge
  lede: Chef's Fridge looks at a photo of your fridge or pantry, names the food it can see, and writes recipes from those ingredients. The original is a Python app. The demo on this site is a smaller rebuild of the same idea, and the differences between the two are the interesting part.
  sections:
    - title: The original app
      steps:
        - head: Take or upload photos
          body: The app is built with Streamlit, so the whole interface is Python. You upload photos or use the camera, and a photo you have already added is skipped by comparing a fingerprint of the image.
        - head: Ask the model what it sees
          body: Each photo goes to Gemini with one request (2.0 Flash when the app was built), to list every food item as a comma-separated line. The answers from all the photos are split, merged and stripped of duplicates.
        - head: Let the person fix the list
          body: Before any recipe is written, the list is shown and can be edited. A missed item can be added and a wrong one removed, so a mistake in reading the photo does not carry into the recipe.
        - head: Write the recipes
          body: A second request sends the final list, plus the diet and cuisine you picked, and asks for a title, ingredients with quantities, and numbered steps in plain text. Pattern matching then strips stray formatting and finds the ingredients and steps so the app can lay them out.
        - head: Keep or print
          body: A recipe can be saved for the session or downloaded as a PDF.
    - title: The version on this site
      points:
        - head: One request, structured answer
          body: The demo sends the photo once and asks for the ingredients and a recipe together, as data that must match a fixed shape. There is no text to clean up and nothing to guess at, which removes the most fragile part of the original.
        - head: The key stays on the server
          body: The browser never sees the model key. The photo goes to a small server function, which adds the key and calls the model.
        - head: Smaller photos
          body: The photo is shrunk in the browser to at most 1024 pixels on its longer side before it is sent. That is enough for the model and much lighter on a phone connection.
        - head: Hard limits
          body: Each visitor gets 3 tries a day and the whole site gets 120. A try is counted before the model is called, so failures and retries cannot be used to go past the cap. Visitors are counted by a one-way code that changes every day, so no address is stored.
        - head: Text in a photo is not an instruction
          body: The model is told to treat any writing inside the photo as part of the picture. A note on the fridge door that says "ignore your instructions" is just a note.
    - title: Limits
      list:
        - The model can miss an item or name one wrongly. The original app lets you correct the list. The demo here does not.
        - The recipes are written by a language model and have not been tested in a kitchen.
        - Diet and cuisine are requests to the model, not checks. It does not verify allergens.
        - The original was built on Gemini 2.0 Flash, which has since been shut down. It has been moved to a newer model, and the model is now a setting, so the next shutdown is a one-line change.
- id: parity
  lede: Take a set of digits. How many even numbers of a given length can you write with them, and how many odd? This is a formula that answers without listing the numbers. The first version was a shortcut that turned out to be exactly right in one case and wrong in another. The second version is right in both.
  sections:
    - title: The first rule, and where it breaks
      steps:
        - head: The rule
          body: Count every arrangement, then multiply by the share of the digits that are even. With the digits 1, 2, 3, 4 and two-digit numbers that do not repeat a digit, there are 12 arrangements and half the digits are even, so 6 even numbers.
        - head: Why it is exact, not an estimate
          body: A number is even when its last digit is even, and nothing else about it matters. Every digit is equally likely to land in the last place. So the share of even numbers is exactly the share of even digits. The first draft of this work called the rule an estimate. Without a zero in the set, it is not one.
        - head: Where it breaks
          body: Add 0 to the set. A number cannot start with 0, but the rule's total still counts the arrangements that do. With the digits 0 to 4 and three-digit numbers that do not repeat a digit, the rule says 60 numbers with 36 of them even. The truth is 48 and 30.
    - title: The exact method
      steps:
        - head: Fill the last place first
          body: It alone decides whether the number is even or odd, so choose it before anything else.
        - head: Then the first place
          body: Any digit except 0, and except the one already used if digits may not repeat.
        - head: Then everything in between
          body: Whatever is left.
        - head: With zero and no repeats, count two groups
          body: A number that ends in 0 has used up the zero, so its first place has no problem. A number that ends in another even digit still has to keep 0 out of the front. Count the two groups separately and add them. For the example above that is 12 ending in 0, plus 18 ending in 2 or 4, which makes 30.
    - title: How it is checked
      text:
        - The formula is compared with a full listing for every one of the 1,023 possible sets of digits, at lengths 1 to 5, with and without repeats. That is 10,230 cases, with no mismatches.
        - The same test confirms both halves of the story about the first rule. It is right in every case without a zero, and wrong in every case where a zero could lead.
        - The demo on this site runs the first rule, the exact formula and the full listing side by side, so you can pick a case and check it yourself.
    - title: Limits
      list:
        - The digits in the set must all be different. A set with a repeated digit, such as 1, 1, 2, needs a different count.
        - It answers even or odd only. Divisibility by 3, 4 or 5 follows other rules.
        - These are elementary counting results. The work here is in stating every case and checking all of them, not in new mathematics.
- id: tickbook
  lede: Tickbook is a limit order book and matching engine, the part of an exchange that decides who trades with whom and at what price. It is written in C++20. The book on this site is that same C++ compiled to WebAssembly, so the orders you place are matched by the real engine inside your browser tab.
  sections:
    - title: What happens to an order
      steps:
        - head: Check it
          body: An order with quantity 0 is rejected. So is an order whose id belongs to an order resting in the book right now.
        - head: Match while prices cross
          body: A buy order trades against the lowest-priced sell orders, and a sell order against the highest-priced buy orders. At the same price, the order that arrived first trades first. The trade happens at the resting order's price. If you bid 105 and the best ask is 100, you pay 100.
        - head: Decide what happens to the rest
          body: A plain limit order rests in the book at its price until it trades or is cancelled. Immediate or cancel drops whatever did not trade. Fill or kill trades the whole quantity or does nothing, and it decides before trading by adding up the totals of the price levels within its limit. A market order has no price to rest at, so its remainder is dropped.
        - head: Record the trades
          body: Every fill is added to a trade log with both order ids, the price and the quantity. Prices are whole ticks and quantities are whole units, so no floating point is used for money anywhere in the engine.
    - title: Four data structures, one question each
      points:
        - head: Which price is best?
          body: Each side of the book is a sorted map from price to a price level. Finding or adding a level costs time that grows with the logarithm of the number of prices. An array indexed by tick would be faster but needs a price range fixed in advance, and it is what I would try next.
        - head: Who is first at a price?
          body: Each level is a queue kept as a doubly linked list. New orders join the tail and trades take from the head. Because every order knows both its neighbours, cancelling one from the middle of the queue takes the same time as cancelling from either end.
        - head: Where is order 12345?
          body: A cancel arrives with only an id. A hash map from id to the order's slot finds it without scanning the book.
        - head: Where do orders live?
          body: All resting orders sit in one array. A removed order's slot goes on a free list and the next new order reuses it, so the engine does not ask for memory on every order. Orders point at each other by 32-bit position in that array, which stays correct when the array grows and moves.
    - title: How it is checked
      text:
        - There are 33 tests. 32 are unit tests, one behaviour each. The last is a randomized test that feeds the same random orders to the engine and to a second order book, written to be slow and obviously correct, which shares no data structure with it. After every operation the result and the trades must be identical.
        - "One default run of that test, measured: 300 streams, 1,200,000 operations and 556,489 trades, in about 1.2 seconds."
        - To see whether the randomized test catches real bugs, I broke the engine on purpose in five ways, one at a time. Four made the test fail. The fifth made the engine loop forever, so tests now have a 120 second timeout and a hang counts as a failure.
        - All 33 tests also pass under AddressSanitizer and UndefinedBehaviorSanitizer, which catch memory errors and undefined behaviour while the program runs.
    - title: How fast, and how that was measured
      text:
        - "The native benchmark times 5,000,000 operations from a made-up stream on one thread: 50% limit orders that rest, 4% limit orders that cross, 3% market orders and 43% cancels. The stream is generated before the clock starts. It ran on a MacBook with an Apple M5 Pro, in a release build, 11 times."
        - The median was 17.26 million operations a second in one sitting and 10.35 million in another, when a browser was using more than a full core. So the honest figure is about 10 to 19 million a second on one core, depending on what else the laptop is doing. I have not measured it on an idle, dedicated machine.
        - With a clock read around every operation, 99% of operations finished within 416 nanoseconds. The clock on that machine ticks every 41 nanoseconds, so I do not quote a median. The slowest single operation took 32.8 milliseconds, and it was the engine's memory growing, not matching.
    - title: The version on this page
      points:
        - head: Same engine, different compiler
          body: Emscripten compiles the same source to one WebAssembly file of about 23 KB. The engine needed no changes because it does no input or output and uses no threads or clock.
        - head: A thin C interface
          body: A browser cannot call C++ classes directly. One extra file wraps a single book behind nine plain functions that take numbers, and writes results into a block of 32-bit integers that the page reads. It hands out order ids and contains no matching logic.
        - head: The page only draws
          body: The page sends your order to the engine, then asks it for the price levels, your resting orders and the new trades. It never works out a fill itself.
        - head: The sample orders are made up
          body: With sample orders on, random orders arrive so there is something to trade against. They are not market data.
        - head: Its own timer
          body: The native figures say nothing about this build, so the page can time itself. The button runs 500,000 operations with the same mix as the native benchmark, from a different random stream, after 20,000 resting orders, and shows the result for your device. On the laptop above, in Chromium 156, five runs gave 4.8 to 5.3 million operations a second. That includes a call from JavaScript into the engine for every operation, and the stream is shorter, so it is not a like-for-like comparison with the native figure.
    - title: Limits
      list:
        - One instrument and one thread. There is no locking.
        - No order modify, stop orders, iceberg orders or self-trade prevention. The engine does not know who owns an order.
        - Nothing is saved. The book lives in memory, and on this page it is gone when you leave.
        - The benchmark stream is synthetic, and real order flow has different shapes. It was measured on one laptop under normal use.
        - The browser interface carries 32-bit numbers, and the demo caps price and quantity at 1,000,000. The engine underneath uses 64 bits.

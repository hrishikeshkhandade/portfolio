# "How it works" write-ups, one per project, shown at /how. The id must match a project in site.yaml.
# Each section has a title and exactly one of: steps (numbered), points (name and explanation),
# list (bullets) or text (paragraphs). Only write what is true and checkable.
- id: aslive
  lede: ASLive turns a hand held up to a camera into typed letters. Nothing in it needs a server. The whole pipeline runs on the device, and on this site it runs inside your browser tab.
  sections:
    - title: From camera frame to letter
      steps:
        - head: Find the hand
          body: "Each camera frame goes to MediaPipe's hand tracker, which returns 21 landmarks: the wrist and four points along each finger, each with x, y and depth. On this site the tracker runs in a background thread so the page never stalls, on the graphics card when there is one."
        - head: Make every hand comparable
          body: Raw positions depend on where the hand sits in the frame and how far it is from the lens. So every point is measured from the wrist, then divided by the distance from the wrist to the tip of the middle finger. A hand close to the camera and a hand at arm's length come out as nearly the same 63 numbers.
        - head: Let 100 trees vote
          body: "Those 63 numbers go to a Random Forest: 100 decision trees that each look at the hand and vote. The result is a probability for each of 27 signs, the letters A to Z plus space."
        - head: Decide when to type
          body: A camera produces many answers a second, and a hand passes through other shapes on its way to the one it means. The app accepts a letter only when the model is 90 to 95% sure of it. On this site a letter is typed after the model gives the same answer 12 frames in a row with at least 50% confidence.
    - title: What the design buys
      points:
        - head: Landmarks, not pixels
          body: The classifier never sees the image, only 63 numbers. Lighting, background and skin tone are dealt with by the hand tracker before the model runs, and the model itself stays small.
        - head: A forest, not a neural network
          body: I tried a neural network first and spent two or three hours on it. I had recorded all the training data myself, so there was not much of it, and the network did not learn the signs reliably. A Random Forest on the hand landmarks gave better results from that small amount of data, and faster ones. The trained model is 2.7 MB, needs no graphics card, and runs on every frame.
        - head: Everything on the device
          body: The video never leaves the device. There is no server to send it to.
    - title: Moving it into a browser
      text:
        - The app is written in Python with scikit-learn. For this site the trained forest is exported into a single binary file, with a small TypeScript reader that walks the same trees. The model in the demo is the real one, not a lookalike.
        - "To prove the port is exact, an automated test runs 150 real hands through both versions. Every top answer matches, and no probability differs by more than 0.01."
    - title: Limits
      list:
        - It reads fingerspelling, one hand at a time. Full ASL has signs, grammar, movement and facial expression, and this does not attempt them.
        - J and Z are traced in the air in real ASL. The model sees one frame at a time, so it knows them only as a still pose.
        - I recorded all the training data with my own hands, so the model has learned one person's hands and one person's way of signing.
        - The accuracy figure, 85 to 90%, comes from testing it live by hand.
- id: super-scholar
  lede: Super Scholar takes a research paper and turns it into a platformer. Each section becomes a world with levels, a short lesson, practice questions and a boss that quizzes you. It works on five built-in papers, on any PDF you upload, and on papers found by searching OpenAlex.
  sections:
    - title: From PDF to game
      steps:
        - head: Read the PDF in the browser
          body: pdf.js pulls the text out of the PDF inside the browser tab, line by line, along with each line's font size. The file itself is never uploaded. It handles papers up to 120 pages.
        - head: Find the sections
          body: Headings are usually set in a bigger font than the body. So the generator works out which font size most of the text uses and treats larger lines as headings. When a PDF does not do that, it falls back to numbered lines like "3 Results". Page numbers and repeated headers are dropped, and everything from the references on is cut. Sections become worlds, five at most, and extra sections are merged with their neighbours.
        - head: Find what matters
          body: Key terms are the words and two-word phrases that come up often in some sections but not everywhere, which is a TF-IDF score. Each sentence is scored by the key terms it contains, with a bonus for the opening sentences of a section. The best sentences become the lesson, and the key terms become fill-in-the-blank questions.
        - head: Rewrite it in plain words, when possible
          body: When a free AI model is available, it is sent each section's key sentences and asked to rewrite that world in plain words. Its answer must pass the same strict checks as everything else in the game. If it fails them, or no model answers, the rules-made world is used instead. Each paper's result is saved, so the same paper never costs a second request.
        - head: Build the levels
          body: Levels are stitched together from small hand-designed chunks, each one beatable on its own. The same seed always gives the same level, and a difficulty setting decides how many enemies and hazards go in.
    - title: What the design buys
      points:
        - head: Rules first, AI second
          body: The game never depends on an AI answering. The rules alone turn a paper into a full playable game, with no server involved. A model being down or out of quota costs some polish and nothing else.
        - head: Chunks, not random tiles
          body: A level made of random tiles can be impossible to finish. A level made of chunks that are each beatable stays beatable, and a checker confirms it.
        - head: Fair, not just possible
          body: The checker finds every spot the player can reach by walking, dropping and jumping. It allows a jump to use at most 80% of a perfect running jump's reach, so a level is fair for a person and not only possible for a computer.
    - title: How it is tested
      text:
        - There are 192 automated tests. One of them generates 500 levels across every difficulty and checks that each can be finished.
        - A further 19 play-through checks drive the real game in a hidden browser, including on a phone-sized screen.
        - The server side limits how many requests each visitor can make a minute, and every page is sent with a strict content security policy.
    - title: Limits
      list:
        - The rules read text only. Figures, tables and equations do not make it into the game.
        - Rules-made questions are fill-in-the-blank on key terms. They test whether you remember a term, not whether you understand it.
        - A scanned paper with no text layer cannot be read.

<!doctype html>
<!--
  Draws the link preview image (public/share.png, 1200 x 630). Not part of the built site.
  One open hand; each fingertip points to a project from content/site.yaml.
  To regenerate, with the dev server running on port 5179:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=public/share.png http://localhost:5179/dev/share-card.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share card</title>
    <style>
      html, body { margin: 0; }
      .card {
        position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
        background: #f4efe4; color: #1b1a17; padding: 60px 72px;
        display: grid; grid-template-rows: auto 1fr; 
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      }
      .label { margin: 0; font-size: 20px; letter-spacing: 0.04em; color: #6b665b; }
      .label b { font-weight: 500; color: #1f7a4d; }
      .main { align-self: center; max-width: 520px; padding-bottom: 20px; }
      h1 { margin: 0; font-family: 'Newsreader Variable', Georgia, serif; font-weight: 400; font-size: 96px; line-height: 0.98; letter-spacing: -0.03em; }
      .line { margin: 30px 0 0; font-family: 'Newsreader Variable', Georgia, serif; font-size: 36px; line-height: 1.25; letter-spacing: -0.01em; }
      .art { position: absolute; left: 566px; top: 0; width: 600px; height: 630px; }
      canvas { position: absolute; inset: 0; width: 600px; height: 630px; }
      .tag { position: absolute; margin: 0; font-size: 20px; line-height: 1; white-space: nowrap; transform: translateY(-50%); }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label" id="label"></p>
      <div class="main">
        <h1 id="name"></h1>
        <p class="line">Software you can open and use.</p>
      </div>
      <div class="art" id="art"><canvas id="hand" width="600" height="630"></canvas></div>
    </div>
    <script type="module" src="./share-card.ts"></script>
  </body>
</html>

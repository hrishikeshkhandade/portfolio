<!doctype html>
<!--
  Draws the link preview image (public/share.png, 1200 x 630). Not part of the built site.
  The row of hands fingerspells a word (default: HRISHI); ?spell=WORD tries another.
  To regenerate, with the dev server running on port 5179:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=public/share.png http://localhost:5179/dev/share-card.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share card</title>
    <style>
      html, body { margin: 0; }
      .card {
        width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
        background: #f4efe4; color: #1b1a17; padding: 54px 72px 50px;
        display: grid; grid-template-rows: auto auto 1fr auto; row-gap: 0;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      }
      .label { margin: 0; font-size: 20px; letter-spacing: 0.04em; color: #6b665b; }
      .label b { font-weight: 500; color: #1f7a4d; }
      h1 { margin: 22px 0 0; font-family: 'Newsreader Variable', Georgia, serif; font-weight: 400; font-size: 88px; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
      .spell { align-self: center; display: grid; gap: 10px; }
      canvas { display: block; width: 1056px; height: 236px; }
      .letters { position: relative; height: 26px; margin: 0; font-size: 19px; color: #6b665b; }
      .letters span { position: absolute; top: 0; transform: translateX(-50%); }
      .work { margin: 0; padding: 20px 0 0; border-top: 1px solid rgba(27, 26, 23, 0.18); font-size: 20px; color: #1b1a17; display: flex; justify-content: space-between; }
      .work span { color: #6b665b; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label" id="label"></p>
      <h1 id="name"></h1>
      <div class="spell">
        <canvas id="hands" width="1056" height="236"></canvas>
        <p class="letters" id="letters"></p>
      </div>
      <p class="work" id="work"></p>
    </div>
    <script type="module" src="./share-card.ts"></script>
  </body>
</html>
